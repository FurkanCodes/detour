[workspace]
resolver = "2"
members = ["crates/detour-core", "crates/detour-service", "crates/detour-engine", "crates/detour-cli", "crates/detour-app"]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"

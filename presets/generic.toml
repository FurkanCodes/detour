name = "Generic (SNI split only)"
description = "No DNS changes. Browsers send the TLS ClientHello one byte per packet; other programs send it in two-byte packets. For ISPs that filter by SNI but do not poison DNS."
lists = ["discord", "roblox", "custom"]

[engine]
path = "detour-engine.exe"
args = [
    "--hostlist={hostlist}",
    "--proxy-split=chunk:1",
    "--split-pos=1,sni+1",
    "--chunk-size=2",
]

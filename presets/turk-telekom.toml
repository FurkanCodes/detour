name = "Türk Telekom"
description = "Browsers: the TLS ClientHello goes out one byte per packet, as BypaxDPI does it. Other programs: split behind a decoy that expires after 4 hops. Domains resolve through Yandex DNS (port 1253), which bypasses Türk Telekom's DNS poisoning."
lists = ["discord", "roblox", "custom"]

[engine]
path = "detour-engine.exe"
args = [
    "--hostlist={hostlist}",
    "--proxy-split=chunk:1",
    "--split-pos=1,sni+1",
    "--fake-ttl=4",
    "--dns-redirect=77.88.8.8:1253",
]

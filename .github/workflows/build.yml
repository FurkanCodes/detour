name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: pwsh scripts/package.ps1
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/Detour-Desktop/* -DestinationPath dist/Detour-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Detour-Windows
          path: dist/Detour-Windows.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p detour-app -p detour-engine -p detour-core
      - run: bash scripts/package-macos.sh
      - run: ditto -c -k --keepParent dist/Detour.app dist/Detour-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Detour-macOS
          path: dist/Detour-macOS.zip

  release:
    # Pushing a tag such as v0.2.1 publishes both builds as a GitHub release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum Detour-Windows.zip Detour-macOS.zip > SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Detour ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md \
            release/Detour-Windows.zip release/Detour-macOS.zip release/SHA256SUMS.txt
